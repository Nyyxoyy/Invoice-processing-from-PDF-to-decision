<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Invoice desk</title>
    <script>
      // Select the onboarding shell before first paint, including old bookmarks.
      if (["#home", "#dataset"].includes(location.hash) || (!location.hash && location.pathname.startsWith("/onboarding")))
        document.documentElement.classList.add("onboarding-shell");
      // The theme follows the browser (prefers-color-scheme) and nothing else.
      // Applied before first paint so there is no light flash; app.js keeps it
      // in step when the browser preference changes while the page is open.
      (function () {
        try {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/workflow.js" defer></script>
    <script src="/static/resolve.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="sidebar">
      <a class="brand" href="#invoices"
        ><span class="brand-mark">i</span>Invoice desk</a
      >
      <div class="workspace-label" id="workspace-label">WORKSPACE</div>
      <nav aria-label="Main navigation">
        <a href="#dashboard" data-nav="dashboard"><span aria-hidden="true">◫</span>Dashboard</a>
        <a href="#invoices" data-nav="invoices"
          ><span aria-hidden="true">▤</span
          ><span id="invoice-nav-label">Invoice reviews</span
          ><span id="nav-count" class="nav-count"></span
        ></a>
        <a href="#requests" data-nav="requests" class="reviewer-only"
          ><span aria-hidden="true">↗</span>My requests</a
        >
        <a href="#pos" data-nav="pos"
          ><span aria-hidden="true">▦</span>Purchase orders</a
        >
        <a href="#vendors" data-nav="vendors"
          ><span aria-hidden="true">◇</span>Suppliers</a
        >
        <a href="#edge-cases" data-nav="edge-cases"
          ><span aria-hidden="true">⚠</span>Edge cases</a
        >
        <a href="#queue" data-nav="queue" class="admin-only" hidden
          ><span aria-hidden="true">◈</span>Requests<span
            id="queue-count"
            class="nav-count"
          ></span
        ></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="#activity" data-nav="activity">Activity log</a
        ><a href="#help" data-nav="help">Help & demo settings</a>
        <div class="workspace-name">
          <span class="avatar">AC</span>
          <div>Acme Corporation<small>Demo workspace</small></div>
        </div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <span id="breadcrumb">Accounts payable / Invoices</span>
        <div class="topbar-right">
          <span id="role-badge" class="role-badge" hidden></span>
          <button
            id="switch-role"
            class="theme-toggle"
            type="button"
            data-action="switch-role"
            title="Switch between invoice review and procurement"
            hidden
          >
            Switch role
          </button>
          <span class="demo-label">Demo workspace</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
    <input
      id="file-input"
      type="file"
      accept=".pdf,.zip,application/pdf,application/zip"
      multiple
      class="sr-only"
      aria-label="Choose invoice PDFs or a ZIP archive"
    />
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="app-modal" class="app-modal" aria-labelledby="modal-title">
      <div class="modal-head">
        <div>
          <h2 id="modal-title"></h2>
          <p id="modal-subtitle" hidden></p>
        </div>
        <button type="button" class="modal-close" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </dialog>
    <!-- Quick resolve: one held invoice, one decision at a time. Rendered by app.js. -->
    <dialog id="resolve-dialog" class="resolve-dialog" aria-label="Resolve invoice" tabindex="-1"></dialog>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="button-row">
          <button value="cancel">Cancel</button
          ><button id="confirm-yes" value="confirm" class="danger">
            Confirm
          </button>
        </div>
      </form>
    </dialog>
    <noscript>Enable JavaScript to upload and review invoices.</noscript>
  </body>
</html>
