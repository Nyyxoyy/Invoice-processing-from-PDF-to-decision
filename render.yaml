# Render blueprint — free tier: public HTTPS URL, no persistent disk.
# The container's filesystem resets when the service sleeps or redeploys, so the
# demo database returns to its seeded state. Fine for a demo; for persistence
# switch to a paid plan and add a disk mounted at /data.
services:
  - type: web
    name: invoice-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard, never in the repo
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: REVIEWER_ACCESS_CODE
        sync: false
